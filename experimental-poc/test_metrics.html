<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Phase 3 Metrics Quantitative Benchmark</title>
  <script src="lib/ort.min.js"></script>
</head>
<body style="background:#111; color:#fff; font-family:monospace; padding:20px;">
  <h1>Phase 3 Precision Quantitative Benchmark</h1>
  <pre id="output">Starting benchmark...</pre>
  <canvas id="cDet" width="320" height="320" style="display:none;"></canvas>
  <canvas id="cSeg" width="256" height="256" style="display:none;"></canvas>
  <canvas id="cEval" width="801" height="1112" style="display:none;"></canvas>

  <script>
    const ANATOMICAL_LABELS = [
      "FEMALE_GENITALIA_COVERED", "FACE_FEMALE", "BUTTOCKS_EXPOSED",
      "FEMALE_BREAST_EXPOSED", "FEMALE_GENITALIA_EXPOSED", "MALE_BREAST_EXPOSED",
      "ANUS_EXPOSED", "FEET_EXPOSED", "BELLY_COVERED", "FEET_COVERED",
      "ARMPITS_COVERED", "ARMPITS_EXPOSED", "FACE_MALE", "BELLY_EXPOSED",
      "MALE_GENITALIA_EXPOSED", "ANUS_COVERED", "FEMALE_BREAST_COVERED", "BUTTOCKS_COVERED"
    ];
    const CORE_EXPOSED = new Set([
      "FEMALE_BREAST_EXPOSED", "FEMALE_GENITALIA_EXPOSED", "MALE_GENITALIA_EXPOSED",
      "BUTTOCKS_EXPOSED", "ANUS_EXPOSED", "MALE_BREAST_EXPOSED"
    ]);

    const out = document.getElementById('output');
    function log(msg) { console.log(msg); out.textContent += msg + '\n'; }

    async function benchmark() {
      try {
        ort.env.wasm.wasmPaths = 'lib/';
        ort.env.wasm.numThreads = 2;
        ort.env.wasm.simd = true;

        log('Loading models...');
        const detSession = await ort.InferenceSession.create('model/320n.onnx', { executionProviders: ['wasm'] });
        const segSession = await ort.InferenceSession.create('model/selfie_segmentation_fp32.onnx', { executionProviders: ['wasm'] });
        log('Models loaded.');

        // Load image & GT mask
        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise(r => { img.onload = r; img.src = 'samples/real_sample.jpg'; });

        const gtImg = new Image();
        gtImg.crossOrigin = 'anonymous';
        await new Promise(r => { gtImg.onload = r; gtImg.src = 'samples/real_sample_gt_target.png'; });

        const W = img.naturalWidth;
        const H = img.naturalHeight;
        log(`Loaded real_sample.jpg (${W}x${H}) and real_sample_gt_target.png (${gtImg.naturalWidth}x${gtImg.naturalHeight})`);

        // Get ground truth target pixels
        const evalCanvas = document.getElementById('cEval');
        evalCanvas.width = W; evalCanvas.height = H;
        const eCtx = evalCanvas.getContext('2d', { willReadFrequently: true });
        eCtx.drawImage(gtImg, 0, 0);
        const gtData = eCtx.getImageData(0, 0, W, H).data;
        let totalTargetPixels = 0;
        for (let i = 0; i < gtData.length; i += 4) {
          if (gtData[i] > 128) totalTargetPixels++;
        }
        log(`Total Target Anatomical Pixels (Ground Truth): ${totalTargetPixels} (${((totalTargetPixels / (W * H)) * 100).toFixed(2)}% of image)`);

        // Run Detector
        const dCanvas = document.getElementById('cDet');
        const dCtx = dCanvas.getContext('2d');
        dCtx.drawImage(img, 0, 0, 320, 320);
        const dImgData = dCtx.getImageData(0, 0, 320, 320).data;
        const dInput = new Float32Array(1 * 3 * 320 * 320);
        for (let i = 0; i < 320 * 320; i++) {
          dInput[i] = dImgData[i * 4] / 255.0;
          dInput[320 * 320 + i] = dImgData[i * 4 + 1] / 255.0;
          dInput[2 * 320 * 320 + i] = dImgData[i * 4 + 2] / 255.0;
        }
        const detT0 = performance.now();
        const detRes = await detSession.run({ [detSession.inputNames[0]]: new ort.Tensor('float32', dInput, [1, 3, 320, 320]) });
        const detLatency = performance.now() - detT0;

        // YOLOv8 parsing
        const outputTensor = detRes[detSession.outputNames[0]];
        const data = outputTensor.data;
        const numClasses = 18;
        const numProposals = 2100;
        const scaleX = W / 320;
        const scaleY = H / 320;
        const candidates = [];
        for (let i = 0; i < numProposals; i++) {
          let maxScore = -1, maxClass = -1;
          for (let c = 0; c < numClasses; c++) {
            const score = data[(4 + c) * numProposals + i];
            if (score > maxScore) { maxScore = score; maxClass = c; }
          }
          if (maxScore > 0.20) {
            const label = ANATOMICAL_LABELS[maxClass];
            if (CORE_EXPOSED.has(label)) {
              const cx = data[0 * numProposals + i];
              const cy = data[1 * numProposals + i];
              const w = data[2 * numProposals + i];
              const h = data[3 * numProposals + i];
              const x1 = Math.max(0, (cx - w / 2) * scaleX);
              const y1 = Math.max(0, (cy - h / 2) * scaleY);
              const boxW = Math.min(W - x1, w * scaleX);
              const boxH = Math.min(H - y1, h * scaleY);
              candidates.push({
                classId: maxClass,
                label,
                score: maxScore,
                box: [Math.round(x1), Math.round(y1), Math.round(boxW), Math.round(boxH)]
              });
            }
          }
        }
        candidates.sort((a, b) => b.score - a.score);
        const keptBoxes = [];
        for (const cand of candidates) {
          let overlap = false;
          for (const k of keptBoxes) {
            if (cand.classId === k.classId) {
              const [ax, ay, aw, ah] = cand.box;
              const [bx, by, bw, bh] = k.box;
              const xA = Math.max(ax, bx);
              const yA = Math.max(ay, by);
              const xB = Math.min(ax + aw, bx + bw);
              const yB = Math.min(ay + ah, by + bh);
              const inter = Math.max(0, xB - xA) * Math.max(0, yB - yA);
              const union = (aw * ah) + (bw * bh) - inter;
              if (inter / union > 0.45) { overlap = true; break; }
            }
          }
          if (!overlap) keptBoxes.push(cand);
        }
        log(`Detector latency: ${detLatency.toFixed(1)}ms. Kept Core Exposed Detections: ${keptBoxes.length}`);
        keptBoxes.forEach(d => log(`  -> ${d.label} (${(d.score*100).toFixed(1)}%): [${d.box.join(', ')}]`));

        // Run MediaPipe Selfie Segmenter
        const sCanvas = document.getElementById('cSeg');
        const sCtx = sCanvas.getContext('2d');
        sCtx.drawImage(img, 0, 0, 256, 256);
        const sImgData = sCtx.getImageData(0, 0, 256, 256).data;
        const sInput = new Float32Array(1 * 3 * 256 * 256);
        for (let i = 0; i < 256 * 256; i++) {
          sInput[i] = sImgData[i * 4] / 255.0;
          sInput[256 * 256 + i] = sImgData[i * 4 + 1] / 255.0;
          sInput[2 * 256 * 256 + i] = sImgData[i * 4 + 2] / 255.0;
        }
        const segT0 = performance.now();
        const segRes = await segSession.run({ [segSession.inputNames[0]]: new ort.Tensor('float32', sInput, [1, 3, 256, 256]) });
        const segLatency = performance.now() - segT0;
        log(`Segmenter latency: ${segLatency.toFixed(1)}ms`);

        const rawAlphas = segRes[segSession.outputNames[0]].data; // 256x256 Float32
        
        // Upscale segmenter alphas to full WxH image space using bilinear interpolation
        const fullAlpha = new Float32Array(W * H);
        const sx = 255.0 / (W - 1);
        const sy = 255.0 / (H - 1);
        for (let y = 0; y < H; y++) {
          const gy = y * sy;
          const y0 = Math.floor(gy);
          const y1 = Math.min(255, y0 + 1);
          const dy = gy - y0;
          const row0 = y0 * 256;
          const row1 = y1 * 256;
          const targetRow = y * W;
          for (let x = 0; x < W; x++) {
            const gx = x * sx;
            const x0 = Math.floor(gx);
            const x1 = Math.min(255, x0 + 1);
            const dx = gx - x0;
            const v00 = rawAlphas[row0 + x0];
            const v10 = rawAlphas[row0 + x1];
            const v01 = rawAlphas[row1 + x0];
            const v11 = rawAlphas[row1 + x1];
            const val = (v00 * (1 - dx) + v10 * dx) * (1 - dy) + (v01 * (1 - dx) + v11 * dx) * dy;
            fullAlpha[targetRow + x] = val;
          }
        }

        // Get RGB image data for skin chrominance
        eCtx.drawImage(img, 0, 0);
        const rawRGB = eCtx.getImageData(0, 0, W, H).data;

        // Strategies evaluation
        const strategies = ['rect', 'ellipse', 'person_mask', 'skin_refined'];
        const results = {};

        for (const strat of strategies) {
          const mask = new Uint8Array(W * H);

          for (const det of keptBoxes) {
            const [bx, by, bw, bh] = det.box;
            const cx = bx + bw / 2;
            const cy = by + bh / 2;
            const rx = bw / 2;
            const ry = bh / 2;

            for (let py = by; py < by + bh; py++) {
              if (py < 0 || py >= H) continue;
              const row = py * W;
              for (let px = bx; px < bx + bw; px++) {
                if (px < 0 || px >= W) continue;
                const idx = row + px;

                let inside = false;
                if (strat === 'rect') {
                  inside = true;
                } else if (strat === 'ellipse') {
                  const dx = px - cx;
                  const dy = py - cy;
                  inside = ((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry)) <= 1.0;
                } else if (strat === 'person_mask') {
                  // Detector box intersected with real MediaPipe body silhouette (alpha >= 0.5)
                  inside = fullAlpha[idx] >= 0.5;
                } else if (strat === 'skin_refined') {
                  // Detector box + MediaPipe silhouette + YCbCr skin chrominance
                  if (fullAlpha[idx] >= 0.5) {
                    const r = rawRGB[idx * 4];
                    const g = rawRGB[idx * 4 + 1];
                    const b = rawRGB[idx * 4 + 2];
                    const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
                    const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
                    inside = (cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173);
                  }
                }

                if (inside) {
                  mask[idx] = 1;
                }
              }
            }
          }

          // Evaluate against independent ground truth
          let TP = 0, FP = 0, FN = 0, TN = 0;
          for (let i = 0; i < W * H; i++) {
            const isGT = gtData[i * 4] > 128;
            const isMask = mask[i] === 1;
            if (isGT && isMask) TP++;
            else if (!isGT && isMask) FP++;
            else if (isGT && !isMask) FN++;
            else TN++;
          }

          const censoredTotal = TP + FP;
          const recall = (TP / (TP + FN)) * 100;
          const precision = censoredTotal > 0 ? (TP / censoredTotal) * 100 : 0;
          const wasteRatio = censoredTotal > 0 ? (FP / censoredTotal) * 100 : 0;

          results[strat] = {
            censoredTotal,
            TP, FP, FN, TN,
            recall: recall.toFixed(2),
            precision: precision.toFixed(2),
            wasteRatio: wasteRatio.toFixed(2)
          };

          log(`\n=== Strategy: ${strat.toUpperCase()} ===`);
          log(`  Actual Censored Pixels: ${censoredTotal}`);
          log(`  True Positives (Target covered): ${TP} / ${totalTargetPixels}`);
          log(`  Target Recall: ${recall.toFixed(2)}%`);
          log(`  Missed Target Pixels (FN): ${FN} (${((FN / totalTargetPixels) * 100).toFixed(2)}%)`);
          log(`  Collateral Censored Pixels (FP): ${FP}`);
          log(`  Mask Precision: ${precision.toFixed(2)}%`);
          log(`  Unrelated Content Waste Ratio (FP / Total Censored): ${wasteRatio.toFixed(2)}%`);
        }

        window.__BENCHMARK_RESULTS__ = {
          detLatency,
          segLatency,
          totalTargetPixels,
          results
        };
        log('\nBENCHMARK COMPLETE');
      } catch (e) {
        log('ERROR: ' + e.message + '\n' + e.stack);
      }
    }

    window.onload = benchmark;
  </script>
</body>
</html>
