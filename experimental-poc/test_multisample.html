<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Multi-Sample Photographic Detector Probe</title>
  <script src="lib/ort.min.js"></script>
</head>
<body style="background:#111; color:#fff; font-family:monospace; padding:20px;">
  <h1>Phase 4 Multi-Sample Detection Probe</h1>
  <pre id="output">Initializing...</pre>
  <canvas id="c" width="320" height="320" style="display:none;"></canvas>

  <script>
    const ANATOMICAL_LABELS = [
      "FEMALE_GENITALIA_COVERED", "FACE_FEMALE", "BUTTOCKS_EXPOSED",
      "FEMALE_BREAST_EXPOSED", "FEMALE_GENITALIA_EXPOSED", "MALE_BREAST_EXPOSED",
      "ANUS_EXPOSED", "FEET_EXPOSED", "BELLY_COVERED", "FEET_COVERED",
      "ARMPITS_COVERED", "ARMPITS_EXPOSED", "FACE_MALE", "BELLY_EXPOSED",
      "MALE_GENITALIA_EXPOSED", "ANUS_COVERED", "FEMALE_BREAST_COVERED", "BUTTOCKS_COVERED"
    ];
    const out = document.getElementById('output');
    function log(msg) { console.log(msg); out.textContent += msg + '\n'; }

    async function probe() {
      try {
        ort.env.wasm.wasmPaths = 'lib/';
        ort.env.wasm.numThreads = 2;
        ort.env.wasm.simd = true;

        const session = await ort.InferenceSession.create('model/320n.onnx', { executionProviders: ['wasm'] });
        log('Detector model loaded.');

        const samples = [
          'samples/real_sample.jpg',
          'samples/real_sample_2.jpg',
          'samples/real_sample_3.jpg'
        ];

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        for (const s of samples) {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          await new Promise((r, e) => { img.onload = r; img.onerror = e; img.src = s; });

          const W = img.naturalWidth;
          const H = img.naturalHeight;
          ctx.drawImage(img, 0, 0, 320, 320);
          const imgData = ctx.getImageData(0, 0, 320, 320).data;

          const input = new Float32Array(1 * 3 * 320 * 320);
          for (let i = 0; i < 320 * 320; i++) {
            input[i] = imgData[i * 4] / 255.0;
            input[320 * 320 + i] = imgData[i * 4 + 1] / 255.0;
            input[2 * 320 * 320 + i] = imgData[i * 4 + 2] / 255.0;
          }

          const t0 = performance.now();
          const res = await session.run({ [session.inputNames[0]]: new ort.Tensor('float32', input, [1, 3, 320, 320]) });
          const lat = performance.now() - t0;

          const data = res[session.outputNames[0]].data;
          const numProposals = 2100;
          const numClasses = 18;
          const scaleX = W / 320;
          const scaleY = H / 320;

          const candidates = [];
          for (let i = 0; i < numProposals; i++) {
            let maxScore = -1, maxClass = -1;
            for (let c = 0; c < numClasses; c++) {
              const sc = data[(4 + c) * numProposals + i];
              if (sc > maxScore) { maxScore = sc; maxClass = c; }
            }
            if (maxScore > 0.20) {
              const cx = data[0 * numProposals + i];
              const cy = data[1 * numProposals + i];
              const w = data[2 * numProposals + i];
              const h = data[3 * numProposals + i];
              const x1 = Math.max(0, (cx - w / 2) * scaleX);
              const y1 = Math.max(0, (cy - h / 2) * scaleY);
              const bw = Math.min(W - x1, w * scaleX);
              const bh = Math.min(H - y1, h * scaleY);

              candidates.push({
                label: ANATOMICAL_LABELS[maxClass],
                score: maxScore,
                box: [Math.round(x1), Math.round(y1), Math.round(bw), Math.round(bh)]
              });
            }
          }

          // NMS
          candidates.sort((a, b) => b.score - a.score);
          const kept = [];
          for (const cand of candidates) {
            let overlap = false;
            for (const k of kept) {
              if (cand.label === k.label) {
                const [ax, ay, aw, ah] = cand.box;
                const [bx, by, bw, bh] = k.box;
                const inter = Math.max(0, Math.min(ax + aw, bx + bw) - Math.max(ax, bx)) *
                              Math.max(0, Math.min(ay + ah, by + bh) - Math.max(ay, by));
                const union = aw * ah + bw * bh - inter;
                if (inter / union > 0.45) { overlap = true; break; }
              }
            }
            if (!overlap) kept.push(cand);
          }

          log(`\nSample: ${s} (${W}x${H}) - Latency: ${lat.toFixed(1)}ms`);
          log(`Detections: ${kept.length}`);
          kept.forEach((d, i) => {
            log(`  #${i + 1}: ${d.label} (${(d.score * 100).toFixed(1)}%) -> [${d.box.join(', ')}]`);
          });
        }
        log('\nMULTI-SAMPLE PROBE COMPLETED.');
      } catch (e) {
        log('ERROR: ' + e.message + '\n' + e.stack);
      }
    }

    window.onload = probe;
  </script>
</body>
</html>
